<script>
"use strict";

// ============================================================
// CONFIG
// ============================================================
const API_BASE_URL = "https://vianda2.onrender.com";

const MEAL_TYPES = [
  { key: 'desayuno', label: 'Desayuno', required: true },
  { key: 'almuerzo', label: 'Almuerzo', required: true },
  { key: 'cena', label: 'Cena', required: true },
];
const GOAL_LABELS = { deficit: 'Déficit', mantenimiento: 'Mantenimiento', superavit: 'Superávit' };
const DURATION_OPTIONS = [
  { key: '3d', label: '3 días', days: 3 },
  { key: '7d', label: '1 semana', days: 7 },
  { key: '14d', label: '2 semanas', days: 14 },
  { key: 'custom', label: 'Personalizado', days: null },
];

// ============================================================
// HELPERS
// ============================================================
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function css(obj) {
  return Object.entries(obj)
    .map(([k, v]) => `${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}:${v}`)
    .join(';');
}

function parseIngredientLine(line) {
  const t = line.trim();
  if (!t) return null;
  const m = t.match(/^([\d.,]+)\s*([a-zA-Záéíóúñ]+)?\s+(.*)$/);
  if (m) return { raw_text: t, quantity: parseFloat(m[1].replace(',', '.')) || null, unit: m[2] || null, name: m[3].trim() };
  return { raw_text: t, quantity: null, unit: null, name: t };
}

function ingredientsToText(ingredients) {
  if (!Array.isArray(ingredients)) return '';
  return ingredients.map(i => {
    if (typeof i === 'string') return i;
    const parts = [];
    if (i.quantity != null) parts.push(i.quantity);
    if (i.unit) parts.push(i.unit);
    parts.push(i.name || i.raw || '');
    return parts.join(' ').trim();
  }).join('\n');
}

function normalizeForMatch(str) {
  if (!str) return '';
  return str
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

// Sugiere ingredientes del catálogo que coincidan por substring (en
// cualquier dirección) con el nombre parseado de una línea de receta.
// No decide nada por sí sola: solo arma la lista de opciones, la persona
// elige cuál usar (o "Crear nuevo") en el selector de cada fila.
function suggestIngredients(parsedName, catalogIngredients) {
  const norm = normalizeForMatch(parsedName);
  if (!norm) return { matches: [], rest: catalogIngredients };
  const matches = [];
  const rest = [];
  for (const ing of catalogIngredients) {
    const ingNorm = normalizeForMatch(ing.name);
    if (ingNorm.includes(norm) || norm.includes(ingNorm)) matches.push(ing);
    else rest.push(ing);
  }
  return { matches, rest };
}

function buildIngredientRows(text, catalogIngredients) {
  const lines = text.split('\n').map(parseIngredientLine).filter(Boolean);
  return lines.map((line, idx) => {
    const { matches } = suggestIngredients(line.name, catalogIngredients);
    return {
      key: 'row_' + idx + '_' + Date.now(),
      raw_text: line.raw_text,
      quantity: line.quantity,
      unit: line.unit || '',
      name: line.name,
      ingredientId: '__new__',
      suggestions: matches.map(m => m.id),
    };
  });
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function addDaysISO(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function dateRangeISO(startISO, endISO) {
  const out = [];
  let cur = startISO;
  let guard = 0;
  while (cur <= endISO && guard < 60) {
    out.push(cur);
    cur = addDaysISO(cur, 1);
    guard++;
  }
  return out;
}

function labelForDate(iso) {
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
  } catch (e) {
    return iso;
  }
}

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}

function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  let cur = obj;
  for (const k of keys) {
    if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {};
    cur = cur[k];
  }
  cur[last] = value;
}

// ============================================================
// ESTADO
// ============================================================
const state = {
  view: 'hogar',
  apiError: null,

  household: null,
  householdForm: { name: '', budget: '', num_people: 2 },
  showHouseholdForm: true,
  savingHousehold: false,
  newMember: { name: '', goal: 'mantenimiento' },

  recipes: [],
  recipeSearch: '',
  showAddRecipeForm: false,
  showImportForm: false,
  showExternalSearch: false,
  newRecipe: { name: '', servings: 4, instructions: '', ingredientsText: '', ingredientRows: null },
  importUrl: '',
  importDraft: null,
  importing: false,
  savingRecipe: false,
  externalQuery: '',
  externalResults: [],
  searchingExternal: false,

  planId: null,
  planStartDate: null,
  planEndDate: null,
  planForm: { start_date: todayISO(), duration: '7d', custom_end_date: '' },
  meals: [],
  creatingPlan: false,
  cellDrafts: {},
  snackFormOpenFor: null,
  snackDraft: { recipeId: '', memberId: '', servings: 1 },

  shoppingItems: [],
  generatingList: false,

  ingredients: [],
  newIngredient: { name: '', default_unit: 'g' },
  savingIngredient: false,
  searchingIngredientId: null,
  productQuery: '',
  productResults: [],
  searchingProducts: false,

  compareQuery: '',
  compareResults: [],
  comparing: false,
  compareSearched: false,

  // Popup de detalle de un producto (click en cualquier fila de resultados).
  // context: 'compare' (pestaña Comparar) o 'link' (panel de vincular producto).
  productPopup: null, // { productId, context, ingredientId }
  compareSelectedIds: [], // selección para comparar, contexto 'compare'
  linkSelectedIds: [], // selección para comparar, contexto 'link'
  showCompareModal: null, // 'compare' | 'link' | null
};

function setState(patch) {
  const p = typeof patch === 'function' ? patch(state) : patch;
  Object.assign(state, p);
  render();
}

// ============================================================
// API
// ============================================================
function apiBase() { return API_BASE_URL; }

async function api(path, opts = {}) {
  try {
    const res = await fetch(apiBase() + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!res.ok) {
      let msg = `Error ${res.status}`;
      try {
        const j = await res.json();
        if (Array.isArray(j.detail)) {
          // Errores de validación de FastAPI/Pydantic: [{loc, msg, type}, ...]
          msg = j.detail.map(d => {
            const field = Array.isArray(d.loc) ? d.loc[d.loc.length - 1] : '';
            return field ? `${field}: ${d.msg}` : d.msg;
          }).join(' · ');
        } else if (typeof j.detail === 'string') {
          msg = j.detail;
        } else if (j.message) {
          msg = j.message;
        }
      } catch (e) {}
      setState({ apiError: msg });
      return { ok: false, error: msg };
    }
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    return { ok: true, data };
  } catch (e) {
    setState({ apiError: 'No se pudo conectar con el servidor (' + apiBase() + '). ¿Está corriendo la API?' });
    return { ok: false, error: e.message };
  }
}

// ============================================================
// CARGA INICIAL
// ============================================================
async function init() {
  const hid = localStorage.getItem('vianda_household_id');
  const pid = localStorage.getItem('vianda_plan_id');
  loadHouseholds(hid);
  loadRecipes();
  loadIngredients();
  if (pid) { setState({ planId: pid }); loadPlan(pid); loadShoppingList(pid); }
}

async function loadIngredients() {
  const r = await api('/ingredients/');
  if (r.ok && Array.isArray(r.data)) setState({ ingredients: r.data });
}

async function loadHouseholds(preferId) {
  const r = await api('/households/');
  if (r.ok && Array.isArray(r.data)) {
    let h = r.data.find(x => String(x.id) === String(preferId)) || r.data[0] || null;
    if (h) {
      setState({
        household: h,
        showHouseholdForm: false,
        householdForm: { name: h.name || '', budget: h.budget ?? '', num_people: h.num_people ?? 2 },
      });
      localStorage.setItem('vianda_household_id', h.id);
    }
  }
}

async function loadRecipes() {
  const r = await api('/recipes/');
  if (r.ok && Array.isArray(r.data)) setState({ recipes: r.data });
}

async function loadPlan(id) {
  const r = await api(`/plans/${id}`);
  if (r.ok && r.data) {
    setState({ meals: r.data.meals || [], planStartDate: r.data.start_date, planEndDate: r.data.end_date });
  }
}

async function loadShoppingList(id) {
  const r = await api(`/plans/${id}/shopping-list`);
  if (r.ok && Array.isArray(r.data)) setState({ shoppingItems: r.data });
}

// ============================================================
// ACCIONES
// ============================================================
const actions = {
  dismissError: () => setState({ apiError: null }),
  goHogar: () => setState({ view: 'hogar' }),
  goRecetas: () => setState({ view: 'recetas' }),
  goPlan: () => setState({ view: 'plan' }),
  goLista: () => setState({ view: 'lista' }),
  goIngredientes: () => setState({ view: 'ingredientes' }),
  goComparar: () => setState({ view: 'comparar' }),

  // -------- Ingredientes / búsqueda de productos --------
  addIngredient: async () => {
    const n = state.newIngredient;
    if (!n.name.trim()) return;
    setState({ savingIngredient: true });
    const r = await api('/ingredients/', { method: 'POST', body: JSON.stringify(n) });
    if (r.ok) {
      setState(s => ({
        ingredients: [...s.ingredients, r.data || { ...n, id: Date.now().toString(), product_links: [] }],
        newIngredient: { name: '', default_unit: 'g' },
      }));
    }
    setState({ savingIngredient: false });
  },

  toggleIngredientSearch: (ingredientId) => {
    setState(s => ({
      searchingIngredientId: s.searchingIngredientId === ingredientId ? null : ingredientId,
      productQuery: '',
      productResults: [],
      linkSelectedIds: [],
      productPopup: s.productPopup && s.productPopup.context === 'link' ? null : s.productPopup,
      showCompareModal: s.showCompareModal === 'link' ? null : s.showCompareModal,
    }));
  },

  searchProducts: async () => {
    const q = state.productQuery.trim();
    if (!q) return;
    setState({ searchingProducts: true, linkSelectedIds: [] });
    const ing = state.ingredients.find(i => i.id === state.searchingIngredientId);
    const exclude = ing && ing.exclude_keywords ? `&exclude=${encodeURIComponent(ing.exclude_keywords)}` : '';
    const catHint = ing && ing.category ? `&category_hint=${encodeURIComponent(ing.category)}` : '';
    const r = await api(`/ingredients/products/search?q=${encodeURIComponent(q)}${exclude}${catHint}`);
    if (r.ok && Array.isArray(r.data)) setState({ productResults: r.data });
    setState({ searchingProducts: false });
  },

  runCompareSearch: async () => {
    const q = state.compareQuery.trim();
    if (!q) return;
    setState({ comparing: true, compareSelectedIds: [] });
    const r = await api(`/ingredients/products/search?q=${encodeURIComponent(q)}`);
    if (r.ok && Array.isArray(r.data)) {
      setState({ compareResults: r.data, compareSearched: true });
    }
    setState({ comparing: false });
  },

  linkProduct: async (ingredientId, storeProductId) => {
    const r = await api(`/ingredients/${ingredientId}/link/${storeProductId}`, { method: 'POST' });
    if (r.ok) {
      await loadIngredients();
      setState({ productQuery: '', productResults: [], productPopup: null, linkSelectedIds: [] });
    }
  },

  unlinkProduct: async (ingredientId, linkId) => {
    const r = await api(`/ingredients/${ingredientId}/link/${linkId}`, { method: 'DELETE' });
    if (r.ok) await loadIngredients();
  },

  // -------- Popup de detalle de producto y comparación lado a lado --------
  openProductPopup: (context, productId) => {
    const ingredientId = context === 'link' ? state.searchingIngredientId : null;
    setState({ productPopup: { productId, context, ingredientId } });
  },
  closeProductPopup: () => setState({ productPopup: null }),

  toggleCompareSelect: (context, productId) => {
    const key = context === 'compare' ? 'compareSelectedIds' : 'linkSelectedIds';
    setState(s => {
      const cur = s[key];
      const has = cur.includes(productId);
      let next;
      if (has) next = cur.filter(id => id !== productId);
      else if (cur.length >= 4) next = cur; // tope de 4 para que las tarjetas entren en pantalla
      else next = [...cur, productId];
      return { [key]: next };
    });
  },
  clearCompareSelection: (context) => {
    const key = context === 'compare' ? 'compareSelectedIds' : 'linkSelectedIds';
    setState({ [key]: [] });
  },
  openCompareModal: (context) => setState({ showCompareModal: context }),
  closeCompareModal: () => setState({ showCompareModal: null }),



  // -------- Hogar --------
  toggleEditHousehold: () => setState(s => ({ showHouseholdForm: !s.showHouseholdForm })),

  saveHousehold: async () => {
    setState({ savingHousehold: true });
    const f = state.householdForm;
    const body = { name: f.name, budget: parseFloat(f.budget) || 0, num_people: parseInt(f.num_people) || 1 };
    let r;
    if (state.household) {
      r = await api(`/households/${state.household.id}`, { method: 'PATCH', body: JSON.stringify(body) });
    } else {
      r = await api('/households/', { method: 'POST', body: JSON.stringify(body) });
    }
    if (r.ok && r.data) {
      localStorage.setItem('vianda_household_id', r.data.id);
      setState({ household: r.data, showHouseholdForm: false });
    }
    setState({ savingHousehold: false });
  },

  addMember: async () => {
    const h = state.household;
    if (!h || !state.newMember.name.trim()) return;
    const r = await api(`/households/${h.id}/members`, { method: 'POST', body: JSON.stringify(state.newMember) });
    if (r.ok) {
      const members = [...(h.members || []), r.data && r.data.name ? r.data : { ...state.newMember }];
      setState({ household: { ...h, members }, newMember: { name: '', goal: 'mantenimiento' } });
    }
  },

  // -------- Recetas --------
  toggleAddRecipeForm: () => setState(s => ({ showAddRecipeForm: !s.showAddRecipeForm, showImportForm: false, showExternalSearch: false })),
  toggleImportForm: () => setState(s => ({ showImportForm: !s.showImportForm, showAddRecipeForm: false, showExternalSearch: false })),
  toggleExternalSearch: () => setState(s => ({ showExternalSearch: !s.showExternalSearch, showAddRecipeForm: false, showImportForm: false })),

  searchExternalRecipes: async () => {
    const q = state.externalQuery.trim();
    if (!q) return;
    setState({ searchingExternal: true });
    const r = await api(`/external-recipes/search?q=${encodeURIComponent(q)}`);
    if (r.ok && Array.isArray(r.data)) setState({ externalResults: r.data });
    setState({ searchingExternal: false });
  },

  previewExternalRecipe: async (externalId) => {
    const r = await api(`/external-recipes/${externalId}`);
    if (r.ok && r.data) {
      const d = r.data;
      setState({
        importDraft: {
          name: d.name || '',
          servings: 4,
          instructions: d.instructions || '',
          ingredientsText: ingredientsToText(d.ingredients),
          ingredientRows: null,
        },
        showImportForm: true,
        showExternalSearch: false,
      });
    }
  },

  // -------- Revisión de ingredientes (paso intermedio antes de guardar) --------
  // Convierte el texto libre en filas editables, cada una con su propio
  // selector de ingrediente de catálogo. Nunca vincula nada solo: por
  // defecto cada fila queda en "Crear nuevo", y si hay coincidencias por
  // substring con el catálogo existente se muestran como opciones, pero
  // la persona tiene que elegirlas a propósito.
  reviewNewRecipeIngredients: () => {
    setState(s => ({
      newRecipe: { ...s.newRecipe, ingredientRows: buildIngredientRows(s.newRecipe.ingredientsText, s.ingredients) },
    }));
  },
  backToRawNewRecipe: () => {
    setState(s => ({ newRecipe: { ...s.newRecipe, ingredientRows: null } }));
  },
  setNewRecipeRowField: (idx, field, value) => {
    setState(s => {
      const rows = s.newRecipe.ingredientRows.slice();
      rows[idx] = { ...rows[idx], [field]: value };
      return { newRecipe: { ...s.newRecipe, ingredientRows: rows } };
    });
  },

  reviewImportDraftIngredients: () => {
    setState(s => ({
      importDraft: { ...s.importDraft, ingredientRows: buildIngredientRows(s.importDraft.ingredientsText, s.ingredients) },
    }));
  },
  backToRawImportDraft: () => {
    setState(s => ({ importDraft: { ...s.importDraft, ingredientRows: null } }));
  },
  setImportDraftRowField: (idx, field, value) => {
    setState(s => {
      const rows = s.importDraft.ingredientRows.slice();
      rows[idx] = { ...rows[idx], [field]: value };
      return { importDraft: { ...s.importDraft, ingredientRows: rows } };
    });
  },

  // Resuelve las filas revisadas a un array de ingredientes con
  // ingredient_id ya definido, creando en catálogo solo las que la persona
  // marcó como "Crear nuevo" (deduplicando por nombre dentro del mismo
  // guardado, para no crear el mismo ingrediente dos veces si aparece en
  // varias líneas de la misma receta).
  _resolveIngredientRows: async (rows) => {
    const createdByName = new Map();
    const newlyCreated = [];
    const resolved = [];
    for (const row of rows) {
      let ingredientId = row.ingredientId;
      if (ingredientId === '__new__') {
        const key = normalizeForMatch(row.name);
        if (createdByName.has(key)) {
          ingredientId = createdByName.get(key);
        } else {
          const payload = { name: row.name, default_unit: row.unit || '' };
          const r = await api('/ingredients/', { method: 'POST', body: JSON.stringify(payload) });
          if (r.ok && r.data) {
            ingredientId = r.data.id;
            createdByName.set(key, ingredientId);
            newlyCreated.push(r.data);
          } else {
            ingredientId = null;
          }
        }
      }
      resolved.push({
        raw_text: row.raw_text,
        quantity: row.quantity,
        unit: row.unit || null,
        ingredient_id: ingredientId || null,
      });
    }
    if (newlyCreated.length) {
      setState(s => ({ ingredients: [...s.ingredients, ...newlyCreated] }));
    }
    return resolved;
  },

  saveNewRecipe: async () => {
    const n = state.newRecipe;
    if (!n.name.trim()) return;
    setState({ savingRecipe: true });
    const rows = n.ingredientRows || buildIngredientRows(n.ingredientsText, state.ingredients);
    const ingredients = await actions._resolveIngredientRows(rows);
    const body = { name: n.name, servings: parseInt(n.servings) || 1, instructions: n.instructions, ingredients };
    const r = await api('/recipes/', { method: 'POST', body: JSON.stringify(body) });
    if (r.ok) {
      setState(s => ({
        recipes: [...s.recipes, r.data || body],
        newRecipe: { name: '', servings: 4, instructions: '', ingredientsText: '', ingredientRows: null },
        showAddRecipeForm: false,
      }));
      await loadIngredients();
    }
    setState({ savingRecipe: false });
  },

  runImport: async () => {
    if (!state.importUrl.trim()) return;
    setState({ importing: true, importDraft: null });
    const r = await api('/recipes/import', { method: 'POST', body: JSON.stringify({ url: state.importUrl }) });
    if (r.ok && r.data) {
      const d = r.data;
      setState({
        importDraft: {
          name: d.name || '',
          servings: d.servings || 4,
          instructions: d.instructions || '',
          ingredientsText: ingredientsToText(d.ingredients),
          ingredientRows: null,
        },
      });
    }
    setState({ importing: false });
  },

  saveImportedRecipe: async () => {
    const d = state.importDraft;
    if (!d || !d.name.trim()) return;
    setState({ savingRecipe: true });
    const rows = d.ingredientRows || buildIngredientRows(d.ingredientsText, state.ingredients);
    const ingredients = await actions._resolveIngredientRows(rows);
    const body = { name: d.name, servings: parseInt(d.servings) || 1, instructions: d.instructions, ingredients };
    const r = await api('/recipes/', { method: 'POST', body: JSON.stringify(body) });
    if (r.ok) {
      setState(s => ({
        recipes: [...s.recipes, r.data || body],
        importDraft: null,
        importUrl: '',
        showImportForm: false,
      }));
      await loadIngredients();
    }
    setState({ savingRecipe: false });
  },

  deleteRecipe: async (id) => {
    const r = await api(`/recipes/${id}`, { method: 'DELETE' });
    if (r.ok) setState(s => ({ recipes: s.recipes.filter(x => x.id !== id) }));
  },

  linkRecipeIngredient: async (recipeId, recipeIngredientId, ingredientId, suggestedName) => {
    if (!ingredientId) return;

    if (ingredientId === '__new__') {
      const name = (window.prompt('Nombre del ingrediente para tu catálogo:', suggestedName || '') || '').trim();
      if (!name) return;
      const createRes = await api('/ingredients/', { method: 'POST', body: JSON.stringify({ name, default_unit: 'g' }) });
      if (!createRes.ok || !createRes.data) return;
      ingredientId = createRes.data.id;
      setState(s => ({ ingredients: [...s.ingredients, createRes.data] }));
    }

    const r = await api(`/recipes/${recipeId}/ingredients/${recipeIngredientId}`, {
      method: 'PATCH',
      body: JSON.stringify({ ingredient_id: ingredientId }),
    });
    if (r.ok) await loadRecipes();
  },

  // -------- Plan --------
  createPlan: async () => {
    const h = state.household;
    if (!h) { setState({ apiError: 'Configura tu hogar primero.' }); return; }
    const f = state.planForm;
    const durationDef = DURATION_OPTIONS.find(d => d.key === f.duration);
    let endDate;
    if (durationDef && durationDef.days) {
      endDate = addDaysISO(f.start_date, durationDef.days - 1);
    } else {
      endDate = f.custom_end_date || f.start_date;
    }
    setState({ creatingPlan: true });
    const r = await api('/plans/', { method: 'POST', body: JSON.stringify({ household_id: h.id, start_date: f.start_date, end_date: endDate }) });
    if (r.ok && r.data) {
      localStorage.setItem('vianda_plan_id', r.data.id);
      setState({ planId: r.data.id, planStartDate: r.data.start_date, planEndDate: r.data.end_date, meals: r.data.meals || [] });
    }
    setState({ creatingPlan: false });
  },

  assignMeal: async (dateISO, mealKey) => {
    const key = cellKey(dateISO, mealKey, '');
    const draft = state.cellDrafts[key] || {};
    if (!draft.recipeId) return;
    const servings = draft.servings || (state.household ? state.household.num_people : 2);
    const body = { day: dateISO, meal_type: mealKey, recipe_id: draft.recipeId, servings_override: parseInt(servings), is_required: true };
    const r = await api(`/plans/${state.planId}/meals`, { method: 'POST', body: JSON.stringify(body) });
    if (r.ok) {
      setState(s => ({ meals: [...s.meals, r.data] }));
    }
  },

  openSnackForm: (dateISO) => setState({ snackFormOpenFor: dateISO, snackDraft: { recipeId: '', memberId: '', servings: 1 } }),
  cancelSnackForm: () => setState({ snackFormOpenFor: null }),

  confirmAddSnack: async (dateISO) => {
    const d = state.snackDraft;
    if (!d.recipeId) return;
    const servings = d.memberId ? 1 : (state.household ? state.household.num_people : 1);
    const body = {
      day: dateISO, meal_type: 'snack', recipe_id: d.recipeId,
      member_id: d.memberId || null, is_required: false,
      servings_override: parseInt(d.servings) || servings,
    };
    const r = await api(`/plans/${state.planId}/meals`, { method: 'POST', body: JSON.stringify(body) });
    if (r.ok) {
      setState(s => ({ meals: [...s.meals, r.data], snackFormOpenFor: null }));
    }
  },

  removeMeal: async (mealId) => {
    const r = await api(`/plans/${state.planId}/meals/${mealId}`, { method: 'DELETE' });
    if (r.ok) setState(s => ({ meals: s.meals.filter(m => m.id !== mealId) }));
  },

  generateList: async () => {
    if (!state.planId) return;
    setState({ generatingList: true });
    await api(`/plans/${state.planId}/shopping-list/generate`, { method: 'POST' });
    await loadShoppingList(state.planId);
    setState({ generatingList: false });
  },

  toggleItemChecked: async (itemId, currentChecked) => {
    const newVal = !currentChecked;
    setState(s => ({ shoppingItems: s.shoppingItems.map(i => i.id === itemId ? { ...i, checked: newVal } : i) }));
    await api(`/plans/${state.planId}/shopping-list/${itemId}/check`, { method: 'PATCH', body: JSON.stringify({ checked: newVal }) });
  },
};

function cellKey(dateISO, mealKey, memberId) { return `${dateISO}-${mealKey}-${memberId || 'all'}`; }

function renderCompareModal(s) {
  const context = s.showCompareModal;
  if (!context) return '';
  const selectedIds = context === 'compare' ? s.compareSelectedIds : s.linkSelectedIds;
  const list = context === 'compare' ? s.compareResults : s.productResults;
  const products = selectedIds.map(id => list.find(p => p.id === id)).filter(Boolean);
  if (products.length === 0) return '';
  const cheapest = Math.min(...products.map(p => p.price));
  const showLink = context === 'link' && s.searchingIngredientId;
  return `
    <div data-action="closeCompareModal" style="position:fixed;inset:0;background:oklch(20% 0.01 100 / 0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;">
      <div onclick="event.stopPropagation()" style="background:white;border-radius:16px;max-width:900px;width:100%;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div style="font-weight:800;font-size:16px;font-family:'Nunito',sans-serif;">Comparar productos</div>
          <button data-action="closeCompareModal" style="background:none;border:none;font-size:20px;cursor:pointer;color:oklch(55% 0.02 100);line-height:1;padding:4px;">×</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(${products.length},1fr);gap:14px;">
          ${products.map(p => {
            const isCheapest = p.price === cheapest;
            return `
              <div style="border:1px solid ${isCheapest ? 'oklch(60% 0.13 152)' : 'oklch(90% 0.02 85)'};border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:${isCheapest ? 'oklch(97% 0.02 152)' : 'transparent'};">

function viewPlan() {
  const s = state;
  const hasPlan = !!s.planId && s.planStartDate && s.planEndDate;
  const days = hasPlan ? dateRangeISO(s.planStartDate, s.planEndDate) : [];
  const members = (s.household && s.household.members) || [];

  const dayColumns = days.map(dateISO => {
    const requiredCells = MEAL_TYPES.map(mt => {
      const meal = s.meals.find(m => m.day === dateISO && m.meal_type === mt.key && !m.member_id);
      const key = cellKey(dateISO, mt.key, '');
      const draft = s.cellDrafts[key] || {};
      return { mealKey: mt.key, label: mt.label, meal, draftRecipeId: draft.recipeId || '', draftServings: draft.servings || (s.household ? s.household.num_people : 2) };
    });

    const snackMeals = s.meals.filter(m => m.day === dateISO && m.meal_type === 'snack');

    return `
      <div style="min-width:200px;">
        <div style="background:oklch(99% 0.006 85);padding:10px;font-weight:800;font-size:13px;text-align:center;border-radius:10px 10px 0 0;border:1px solid oklch(90% 0.02 85);border-bottom:none;text-transform:capitalize;font-family:'Nunito',sans-serif;">${esc(labelForDate(dateISO))}</div>
        <div style="border:1px solid oklch(90% 0.02 85);border-radius:0 0 10px 10px;padding:10px;display:flex;flex-direction:column;gap:8px;">
          ${requiredCells.map(cell => `
            <div>
              <div style="font-size:10px;font-weight:800;color:oklch(55% 0.02 100);text-transform:uppercase;margin-bottom:3px;">${cell.label}</div>
              ${cell.meal ? `
                <div style="background:oklch(94% 0.04 152);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;">
                  <div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start;">

                  </div>
                  <div style="font-size:10px;color:oklch(40% 0.05 152);">${esc(cell.meal.servings_override || '')} porciones${cell.meal.estimated_kcal != null ? ` · ~${cell.meal.estimated_kcal} kcal` : ''}</div>

                <select data-change-action="setCellDraftRecipe" data-day="${dateISO}" data-mealkey="${cell.mealKey}" style="width:100%;padding:5px 6px;border-radius:7px;border:1px solid oklch(88% 0.02 85);font-size:11px;margin-bottom:4px;">
                  <option value="">Elegir receta...</option>
                  ${s.recipes.map(r => `<option value="${esc(r.id)}" ${cell.draftRecipeId === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
                </select>
                <div style="display:flex;gap:4px;align-items:center;">
                  <input type="number" min="1" value="${esc(cell.draftServings)}" data-change-action="setCellDraftServings" data-day="${dateISO}" data-mealkey="${cell.mealKey}" style="width:46px;padding:5px 6px;border-radius:7px;border:1px solid oklch(88% 0.02 85);font-size:11px;" />

                </div>
              `}
            </div>
          `).join('')}

          <div style="border-top:1px dashed oklch(90% 0.02 85);padding-top:8px;">
            <div style="font-size:10px;font-weight:800;color:oklch(55% 0.02 100);text-transform:uppercase;margin-bottom:3px;">Merienda (opcional)</div>
            ${snackMeals.map(meal => {
              const memberName = meal.member_id ? ((members.find(m => m.id === meal.member_id) || {}).name || '—') : 'Todo el hogar';
              return `
                <div style="background:oklch(93% 0.02 85);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;margin-bottom:4px;">
                  <div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start;">
                    <div style="font-size:11px;font-weight:800;">${esc((s.recipes.find(r => r.id === meal.recipe_id) || {}).name || 'Receta')}</div>
                    <button data-action="removeMeal" data-id="${esc(meal.id)}" style="background:none;border:none;color:oklch(45% 0.02 100);cursor:pointer;font-size:12px;line-height:1;padding:0;">×</button>
                  </div>
                  <div style="font-size:9px;color:oklch(55% 0.02 100);">${esc(memberName)}${meal.estimated_kcal != null ? ` · ~${meal.estimated_kcal} kcal` : ''}</div>

                  ${s.recipes.map(r => `<option value="${esc(r.id)}" ${s.snackDraft.recipeId === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}

                  <option value="">Todo el hogar</option>
                  ${members.map(m => `<option value="${esc(m.id)}" ${s.snackDraft.memberId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
                </select>
                <div style="display:flex;gap:4px;">
                  <button data-action="confirmAddSnack" data-day="${dateISO}" style="flex:1;background:oklch(68% 0.17 55);color:white;border:none;border-radius:6px;padding:5px;font-weight:800;font-size:10px;cursor:pointer;">Agregar</button>
                  <button data-action="cancelSnackForm" style="background:oklch(90% 0.02 85);border:none;border-radius:6px;padding:5px 8px;font-weight:700;font-size:10px;cursor:pointer;">Cancelar</button>
                </div>
              </div>
            ` : `
              <button data-action="openSnackForm" data-day="${dateISO}" style="width:100%;background:transparent;border:1px dashed oklch(80% 0.02 85);color:oklch(50% 0.02 100);border-radius:7px;padding:5px;font-weight:700;font-size:10px;cursor:pointer;">+ Merienda</button>
            `}
          </div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
      <div>
        <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;margin:0 0 4px;">Plan de compras</h1>
        <p style="color:oklch(55% 0.02 100);margin:0;font-size:14px;">Desayuno, almuerzo y cena son obligatorios; la merienda es opcional y puede ser solo para una persona.</p>
      </div>
    </div>

    ${!hasPlan ? `
      <div style="background:oklch(99% 0.006 85);border:1px solid oklch(90% 0.02 85);border-radius:16px;padding:22px;margin-bottom:20px;">
        <div style="font-weight:800;font-size:16px;margin-bottom:14px;font-family:'Nunito',sans-serif;">Crear plan</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:14px;">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:oklch(45% 0.02 100);">Fecha de inicio
            <input type="date" value="${esc(s.planForm.start_date)}" data-bind="planForm.start_date" style="padding:9px 12px;border-radius:10px;border:1px solid oklch(88% 0.02 85);font-size:14px;" />
          </label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:oklch(45% 0.02 100);">Duración
            <select data-bind="planForm.duration" style="padding:9px 12px;border-radius:10px;border:1px solid oklch(88% 0.02 85);font-size:14px;">
              ${DURATION_OPTIONS.map(d => `<option value="${d.key}" ${s.planForm.duration === d.key ? 'selected' : ''}>${d.label}</option>`).join('')}
            </select>
          </label>
          ${s.planForm.duration === 'custom' ? `
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:oklch(45% 0.02 100);">Fecha final
              <input type="date" value="${esc(s.planForm.custom_end_date)}" data-bind="planForm.custom_end_date" style="padding:9px 12px;border-radius:10px;border:1px solid oklch(88% 0.02 85);font-size:14px;" />
            </label>
          ` : ''}
        </div>
        <button data-action="createPlan" ${s.creatingPlan ? 'disabled' : ''} style="background:oklch(48% 0.13 152);color:white;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;">${s.creatingPlan ? 'Creando...' : 'Crear plan'}</button>
      </div>
    ` : ''}

    ${s.recipes.length === 0 ? `<div style="background:oklch(96% 0.04 55);border:1px solid oklch(85% 0.08 55);border-radius:12px;padding:14px 18px;font-size:13px;color:oklch(40% 0.1 55);margin-bottom:16px;">Añade recetas primero en la pestaña Recetas para poder asignarlas al plan.</div>` : ''}

    ${hasPlan ? `
      <div style="overflow-x:auto;">
        <div style="display:flex;gap:10px;padding-bottom:8px;">${dayColumns}</div>
      </div>
    ` : ''}
  `;
}

function viewLista() {
  const s = state;
  const shoppingItems = s.shoppingItems.map(item => {
    const name = item.ingredient_name || item.name || 'Ingrediente';
    const qty = item.quantity_needed ?? item.quantity ?? item.amount ?? '';
    const unit = item.unit || '';
    const cost = item.estimated_cost ?? item.cost ?? null;
    const store = item.cheaper_store || item.store || item.best_store || '—';
    const checked = !!(item.is_checked ?? item.checked ?? item.purchased);
    return { id: item.id, name, checked, quantityLabel: `${qty} ${unit}`.trim(), costLabel: cost != null ? `$${Number(cost).toFixed(2)}` : '—', cost, store };
  });
  const totalCost = shoppingItems.reduce((sum, i) => sum + (i.cost || 0), 0);
  const budget = s.household ? s.household.budget : null;

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
      <div>
        <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;margin:0 0 4px;">Lista de compras</h1>
        <p style="color:oklch(55% 0.02 100);margin:0;font-size:14px;">Generada a partir de tu plan.</p>
      </div>
      ${s.planId ? `<button data-action="generateList" ${s.generatingList ? 'disabled' : ''} style="background:oklch(48% 0.13 152);color:white;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;">${s.generatingList ? 'Generando...' : 'Generar lista'}</button>` : ''}
    </div>

    ${!s.planId ? `<div style="background:oklch(96% 0.04 55);border:1px solid oklch(85% 0.08 55);border-radius:12px;padding:14px 18px;font-size:13px;color:oklch(40% 0.1 55);">Primero crea un plan en la pestaña anterior.</div>` : ''}

    ${shoppingItems.length > 0 ? `
      <div style="background:oklch(94% 0.04 152);border:1px solid oklch(80% 0.08 152);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-size:14px;font-weight:800;color:oklch(30% 0.08 152);">Costo estimado total: $${totalCost.toFixed(2)}</div>
        ${budget ? `<div style="font-size:12px;color:oklch(40% 0.08 152);">Presupuesto mensual del hogar: $${Number(budget).toFixed(2)}</div>` : ''}
      </div>
      <div style="background:oklch(99% 0.006 85);border:1px solid oklch(90% 0.02 85);border-radius:16px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:34px 1.6fr 1fr 1fr 1.1fr;padding:12px 16px;background:oklch(97% 0.018 85);font-size:12px;font-weight:800;color:oklch(50% 0.02 100);">
          <div></div><div>Ingrediente</div><div>Cantidad</div><div>Costo est.</div><div>Más barato en</div>
        </div>
        ${shoppingItems.map(item => `
          <div style="display:grid;grid-template-columns:34px 1.6fr 1fr 1fr 1.1fr;align-items:center;padding:12px 16px;border-top:1px solid oklch(92% 0.015 85);background:${item.checked ? 'oklch(96% 0.02 152)' : 'transparent'};">
            <input type="checkbox" ${item.checked ? 'checked' : ''} data-change-action="toggleItemChecked" data-id="${esc(item.id)}" data-checked="${item.checked}" style="width:18px;height:18px;cursor:pointer;" />
            <div style="font-size:13px;font-weight:600;color:${item.checked ? 'oklch(60% 0.02 100)' : 'oklch(28% 0.03 145)'};text-decoration:${item.checked ? 'line-through' : 'none'};">${esc(item.name)}</div>
            <div style="font-size:13px;font-weight:600;color:${item.checked ? 'oklch(60% 0.02 100)' : 'oklch(28% 0.03 145)'};text-decoration:${item.checked ? 'line-through' : 'none'};">${esc(item.quantityLabel)}</div>
            <div style="font-size:13px;font-weight:600;color:${item.checked ? 'oklch(60% 0.02 100)' : 'oklch(28% 0.03 145)'};text-decoration:${item.checked ? 'line-through' : 'none'};">${esc(item.costLabel)}</div>
            <div style="font-size:12px;font-weight:800;color:oklch(55% 0.13 55);text-decoration:${item.checked ? 'line-through' : 'none'};">${esc(item.store)}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${shoppingItems.length === 0 && s.planId ? `<div style="text-align:center;padding:50px 20px;color:oklch(55% 0.02 100);font-size:14px;">Aún no hay lista generada para este plan.</div>` : ''}
  `;
}

function viewIngredientes() {
  const s = state;
  const ingredientRows = s.ingredients.map(ing => {
    const linkCount = (ing.product_links || []).length;
    return { id: ing.id, name: ing.name, default_unit: ing.default_unit, category: ing.category, exclude_keywords: ing.exclude_keywords, linksLabel: linkCount > 0 ? `${linkCount} producto(s) vinculado(s)` : 'sin vincular', isSearching: s.searchingIngredientId === ing.id };
  });

  return `
    <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;margin:0 0 4px;">Ingredientes</h1>
    <p style="color:oklch(55% 0.02 100);margin:0 0 22px;font-size:14px;">Vincula cada ingrediente propio a un producto real de Super99 o Riba Smith. Usa "excluir palabras" para que ingredientes parecidos no se confundan (ej: que "arroz" no traiga "arroz con leche").</p>

    <div style="background:oklch(99% 0.006 85);border:1px solid oklch(90% 0.02 85);border-radius:16px;padding:18px;margin-bottom:20px;">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px;">Nuevo ingrediente</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input placeholder="Ej: arroz blanco" value="${esc(s.newIngredient.name)}" data-bind="newIngredient.name" style="flex:1;min-width:180px;padding:10px 12px;border-radius:9px;border:1px solid oklch(88% 0.02 85);font-size:14px;" />
        <select data-bind="newIngredient.default_unit" style="padding:10px 12px;border-radius:9px;border:1px solid oklch(88% 0.02 85);font-size:14px;">
          <option value="g" ${s.newIngredient.default_unit === 'g' ? 'selected' : ''}>gramos (g)</option>
          <option value="ml" ${s.newIngredient.default_unit === 'ml' ? 'selected' : ''}>mililitros (ml)</option>
          <option value="unidad" ${s.newIngredient.default_unit === 'unidad' ? 'selected' : ''}>unidad</option>
        </select>
        <button data-action="addIngredient" ${s.savingIngredient ? 'disabled' : ''} style="background:oklch(48% 0.13 152);color:white;border:none;border-radius:9px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;">${s.savingIngredient ? 'Guardando...' : 'Añadir ingrediente'}</button>
      </div>
    </div>

    ${ingredientRows.length > 0 ? `
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${ingredientRows.map(ing => `
          <div style="background:oklch(99% 0.006 85);border:1px solid oklch(90% 0.02 85);border-radius:14px;padding:14px 18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
              <div>
                <div style="font-weight:800;font-size:15px;">${esc(ing.name)}</div>
                <div style="font-size:12px;color:oklch(55% 0.02 100);">unidad: ${esc(ing.default_unit)} · ${esc(ing.linksLabel)}</div>
              </div>
              <button data-action="toggleIngredientSearch" data-id="${esc(ing.id)}" style="background:transparent;border:1px solid oklch(48% 0.13 152);color:oklch(40% 0.11 152);border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;">${ing.isSearching ? 'Cerrar' : 'Vincular producto'}</button>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
              <input placeholder="excluir palabras (ej: con leche, dulce)" value="${esc(ing.exclude_keywords || '')}" data-change-action="setIngredientExclude" data-id="${esc(ing.id)}" style="flex:1;min-width:180px;padding:6px 9px;border-radius:7px;border:1px solid oklch(88% 0.02 85);font-size:12px;" />
            </div>
            ${ing.isSearching ? productSearchPanel(s.ingredients.find(i => i.id === ing.id), s) : ''}
          </div>
        `).join('')}
      </div>
    ` : `<div style="text-align:center;padding:50px 20px;color:oklch(55% 0.02 100);font-size:14px;">Aún no has creado ningún ingrediente.</div>`}
  `;
}

function viewComparar() {
  const s = state;
  const sorted = [...s.compareResults].sort((a, b) => a.price - b.price);
  const cheapest = sorted.length ? sorted[0].price : null;

  return `
    <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;margin:0 0 4px;">Comparar productos</h1>
    <p style="color:oklch(55% 0.02 100);margin:0 0 22px;font-size:14px;">Busca un producto y compara marcas y precios entre Super99 y Riba Smith.</p>

    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <input placeholder="Ej: leche, arroz, pollo..." value="${esc(s.compareQuery)}" data-bind="compareQuery" data-enter-action="runCompareSearch" style="flex:1;padding:11px 14px;border-radius:10px;border:1px solid oklch(88% 0.02 85);font-size:14px;background:oklch(99% 0.006 85);" />
      <button data-action="runCompareSearch" ${s.comparing ? 'disabled' : ''} style="background:oklch(48% 0.13 152);color:white;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;">${s.comparing ? 'Buscando...' : 'Buscar'}</button>
    </div>

    ${sorted.length > 0 ? `
      ${renderCompareBar('compare', s)}
      <div style="background:oklch(99% 0.006 85);border:1px solid oklch(90% 0.02 85);border-radius:14px;padding:4px 16px;">
        ${sorted.map(p => renderProductRow(p, 'compare', s)).join('')}
      </div>
    ` : ''}
    ${s.compareSearched && sorted.length === 0 ? `<div style="text-align:center;padding:50px 20px;color:oklch(55% 0.02 100);font-size:14px;">Sin resultados para "${esc(s.compareQuery)}".</div>` : ''}
    ${!s.compareSearched ? `<div style="text-align:center;padding:50px 20px;color:oklch(55% 0.02 100);font-size:14px;">Busca un producto para ver marcas y precios de Super99 y Riba Smith lado a lado.</div>` : ''}
  `;
}

// ============================================================
// RENDER PRINCIPAL
// ============================================================
function render() {
  const s = state;
  const root = document.getElementById('root');

  let mainHtml = '';
  if (s.view === 'hogar') mainHtml = viewHogar();
  else if (s.view === 'recetas') mainHtml = viewRecetas();
  else if (s.view === 'plan') mainHtml = viewPlan();
  else if (s.view === 'lista') mainHtml = viewLista();
  else if (s.view === 'ingredientes') mainHtml = viewIngredientes();
  else if (s.view === 'comparar') mainHtml = viewComparar();

  root.innerHTML = `
    <div style="min-height:100vh;background:oklch(97% 0.018 85);color:oklch(28% 0.03 145);display:flex;flex-direction:column;">
      <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:oklch(99% 0.006 85);border-bottom:1px solid oklch(90% 0.02 85);flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:38px;height:38px;border-radius:11px;background:oklch(48% 0.13 152);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:18px;font-family:'Nunito',sans-serif;">V</div>
          <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:oklch(28% 0.03 145);">Vianda</div>
          <div style="font-size:13px;color:oklch(55% 0.02 100);margin-left:4px;">meal planning para tu hogar</div>
        </div>
        ${s.apiError ? `
          <div style="display:flex;align-items:center;gap:10px;background:oklch(94% 0.05 45);border:1px solid oklch(80% 0.1 45);color:oklch(35% 0.1 45);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;">
            <span>⚠ ${esc(s.apiError)}</span>
            <button data-action="dismissError" style="background:none;border:none;color:oklch(35% 0.1 45);cursor:pointer;font-weight:700;font-size:15px;">×</button>
          </div>
        ` : ''}
      </header>

      <nav style="display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;background:oklch(99% 0.006 85);border-bottom:1px solid oklch(90% 0.02 85);">
        <button data-action="goHogar" style="${tabStyle(s.view === 'hogar')}"><span style="${tabNumStyle(s.view === 'hogar')}">1</span> Hogar</button>
        <button data-action="goRecetas" style="${tabStyle(s.view === 'recetas')}"><span style="${tabNumStyle(s.view === 'recetas')}">2</span> Recetas</button>
        <button data-action="goPlan" style="${tabStyle(s.view === 'plan')}"><span style="${tabNumStyle(s.view === 'plan')}">3</span> Plan</button>
        <button data-action="goLista" style="${tabStyle(s.view === 'lista')}"><span style="${tabNumStyle(s.view === 'lista')}">4</span> Lista de compras</button>
        <button data-action="goIngredientes" style="${tabStyle(s.view === 'ingredientes')}"><span style="${tabNumStyle(s.view === 'ingredientes')}">5</span> Ingredientes</button>
        <button data-action="goComparar" style="${tabStyle(s.view === 'comparar')}"><span style="${tabNumStyle(s.view === 'comparar')}">6</span> Comparar</button>
      </nav>

      <main style="flex:1;padding:28px 24px 60px;max-width:1300px;width:100%;margin:0 auto;">
        ${mainHtml}
      </main>
    </div>
    ${renderProductPopup(s)}
    ${renderCompareModal(s)}
  `;
}

// ============================================================
// DELEGACIÓN DE EVENTOS
// ============================================================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const name = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const day = el.getAttribute('data-day');
  const mealkey = el.getAttribute('data-mealkey');
  const ingredientId = el.getAttribute('data-ingredient-id');
  const productId = el.getAttribute('data-product-id');
  const context = el.getAttribute('data-context');

  switch (name) {
    case 'toggleIngredientSearch': actions.toggleIngredientSearch(id); break;
    case 'linkProduct': actions.linkProduct(ingredientId, productId); break;
    case 'deleteRecipe': actions.deleteRecipe(id); break;
    case 'removeMeal': actions.removeMeal(id); break;
    case 'assignMeal': actions.assignMeal(day, mealkey); break;
    case 'previewExternalRecipe': actions.previewExternalRecipe(id); break;
    case 'openSnackForm': actions.openSnackForm(day); break;
    case 'confirmAddSnack': actions.confirmAddSnack(day); break;
    case 'openProductPopup': actions.openProductPopup(context, id); break;
    case 'toggleCompareSelect': actions.toggleCompareSelect(context, id); break;
    case 'openCompareModal': actions.openCompareModal(context); break;
    case 'clearCompareSelection': actions.clearCompareSelection(context); break;
    case 'closeProductPopup': actions.closeProductPopup(); break;
    case 'closeCompareModal': actions.closeCompareModal(); break;
    default:
      if (actions[name]) actions[name]();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;

  const bindPath = el.getAttribute('data-bind');
  if (bindPath) {
    setState(s => { setPath(s, bindPath, el.value); return s; });
    return;
  }

  const changeAction = el.getAttribute('data-change-action');
  if (!changeAction) return;

  if (changeAction === 'setRowField') {
    const formKey = el.getAttribute('data-form');
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    const field = el.getAttribute('data-field');
    const value = field === 'quantity' ? (el.value === '' ? null : parseFloat(el.value)) : el.value;
    if (formKey === 'newRecipe') actions.setNewRecipeRowField(idx, field, value);
    else if (formKey === 'importDraft') actions.setImportDraftRowField(idx, field, value);
  } else if (changeAction === 'linkRecipeIngredient') {
    const recipeId = el.getAttribute('data-recipe-id');
    const recipeIngredientId = el.getAttribute('data-recipe-ingredient-id');
    const rawText = el.getAttribute('data-raw-text');
    actions.linkRecipeIngredient(recipeId, recipeIngredientId, el.value, rawText);
  } else if (changeAction === 'setCellDraftRecipe') {
    const day = el.getAttribute('data-day');
    const mealkey = el.getAttribute('data-mealkey');
    const key = cellKey(day, mealkey, '');
    setState(s => ({ cellDrafts: { ...s.cellDrafts, [key]: { ...(s.cellDrafts[key] || {}), recipeId: el.value } } }));
  } else if (changeAction === 'setCellDraftServings') {
    const day = el.getAttribute('data-day');
    const mealkey = el.getAttribute('data-mealkey');
    const key = cellKey(day, mealkey, '');
    setState(s => ({ cellDrafts: { ...s.cellDrafts, [key]: { ...(s.cellDrafts[key] || {}), servings: el.value } } }));
  } else if (changeAction === 'toggleItemChecked') {
    const id = el.getAttribute('data-id');
    const checked = el.getAttribute('data-checked') === 'true';
    actions.toggleItemChecked(id, checked);
  } else if (changeAction === 'setIngredientExclude') {
    const id = el.getAttribute('data-id');
    const ing = state.ingredients.find(i => i.id === id);
    api(`/ingredients/${id}`, { method: 'PATCH', body: JSON.stringify({ name: ing.name, default_unit: ing.default_unit, category: ing.category, exclude_keywords: el.value }) }).then(() => loadIngredients());
  }
});

document.addEventListener('keydown', (e) => {
  const el = e.target.closest('[data-enter-action]');
  if (!el) return;
  if (e.key === 'Enter') {
    const name = el.getAttribute('data-enter-action');
    if (actions[name]) actions[name]();
  }
});

// ============================================================
// ARRANQUE
// ============================================================
render();
init();
</script>
</body>
</html>
